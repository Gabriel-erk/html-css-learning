<!DOCTYPE html>
<html lang="pt-br">
<!-- cabeça da página, responsável por todas as configurações da página, aqui ficarão informações importantes para o navegador ex: configurações de fontes, arquivos externos (css, scss...) informações, que, na maioria das vezes, não são visíveis para os usuarios (vale exceções de tag title e tag link com relationship (atributo rel) de icon (rel=icon)-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<!-- body, onde todas as informações aqui presentes, serão vistas pelo usuário-->
<body>
<!-- cabeçalho da página -->
<header>
    <h1>Pesquisa Online</h1>
</header>
<main>
    <section>
        <!-- sintaxe padrão de quando se usa a tag form: campo (input, textarea...) e botão de enviar (button type submit)-->
        <!-- atributo da tag html form 'action' recebe uma URL como valor, que é o destino para onde os dados preenchidos no formulário abaixo serão enviados (ex laravel: enviarei para uma URL que irá disparar o método store do meu controller  -->
        <!-- método de envio GET, pega os dados do formulário e os insere na URL, então, por exemplo, caso o formulário abaixo tenha um input com o atributo 'name' com o valor de 'email', ao preencher este input com um valor e clicar em submit, este 'name' (==email) juntamente do valor alocado no campo vai parar na URL do site-->
        <!-- método de envio POST é enviado em formato de cabeçalho/array associativo e não fica exposto na URL-->
        <form action="" method="get">
            <!-- semântica com formulários (semântica == quando queremos DIZER alguma coisa, quando queremos comunicar algo para o navegador e os mecanismos de buscas relacionados ao mesmo, e aqui, explicarei sobre o que a tag semântica fieldset faz)-->
            <!-- fieldset diz para o navegador que dentro da abertura e fechamento da suas tags estará começando um CONJUNTO de elementos/conjunto sobre determinado assunto que começara na ABERTURA dessa tag html semântica chamada fieldset, que quer dizer: esses inputs um abaixo do outro (conjunto) dentro de fieldset possuem RELAÇÃO SEMÂNTICA (relação de SIGNIFICADO, ou seja, o significado de cada campo aqui está conectado com o outro campo, pois todos eles pertencem a uma única Entidade/Model (Usuário))  -->
            <!-- obs: gerará uma 'borda' em volta dos inputs dentro deste fieldset -->
            <!-- tag button fica de fora, pois não possui relação semântica com os inputs -->
            <fieldset>
                <!-- tag que age como uma espécie de legenda (traduzindo legend do inglês), onde a sua principal funcionalidade é dar uma descrição GERAL do conjunto de conteúdo semântico presente no fieldset atual-->
                <!-- que aparecerá no HTML como um h2-->
                <legend>Dados Pessoais</legend>
                <!-- criamos um 'label', elemento HTML responsável por adicionar um texto próximo da nossa tag input abaixo (tanto ao lado, ou acima) onde o atributo for é para representar a qual input html este mesmo label pertence (neste caso aqui, pertence ao input html com o atributo name preenchido com 'userName' (pois usamos o mesmo valor do atributo 'name' do input html que queremos que o label pertença)-->
                <label for="userName">Nome:</label>
                <!-- atributo 'name' indica QUEM é este campo que estamos manipulando, é algo parecido com um 'id', poderemos localizar este input/saber de onde recebemos alguma informação por conta do valor deste atributo 'name' obs: sempre com nomes em inglês -->
                <input type="text" name="userName" required>

                <!-- forma resumida de utilizar o label + input, da maneira abaixo, envolvendo o input entre as tags do label, o for='nameDaSuaTagAqui' (como descrito no exemplo do input acima) é omitido, obs: nos dois exemplos aqui de label + for, ambos possuem um comportamento em comum: ao clicar no texto do label, o campo input recebe o foco -->
                <label>
                    Idade:
                    <!-- informando que os valores mínimos e máximos deste input com nome de 'age' e permitindo apenas valores númericos pode ter é 12 e 100-->
                    <input type="number" name="userAge" min="12" max="100" required>
                </label>

                <label>
                    Birth Date:
                    <input type="date" name="birthDate">
                </label>

                <label>
                    Email:
                    <input type="email" name="userEmail" required>
                </label>

                <label>
                    <!-- tipo tel específico para telefone, atributo name do input já está associado ao label pelo fato do input estar dentro da abertura e fechamento do label e atributo novo (pattern == padrão) está indicando 2 coisas, onde a primeira é que só podemos utilizar numéros entre 0-9 (com [0-9]) e que o número máximo de caracteres permitido neste campo é 11 (em {11})-->
                    <input type="tel" name="userPhoneNumber" pattern="[0-9]{14}" placeholder="(11) 11111-1111">
                </label>

                <label>
                    Upload de foto
                    <!-- criando um input do tipo file (arquivo) e para definir o tipo de arquivo que é permitido enviar, usamos o atributo accept e colocamos o valor image e logo em seguida /* para indicar que é permitido QUALQUER tipo de imagem (.png .jpg, etc.)-->
                    <input type="file" accept="image/*" name="userImage">
                </label>
            </fieldset>
            <!-- neste button aplicamos o type submit, pois ele vai ENVIAR alguma coisa (neste caso, enviará as informações dos campos do formulário em que estamos agora-->
            <button type="submit"></button>
        </form>
    </section>
</main>
</body>
</html>
