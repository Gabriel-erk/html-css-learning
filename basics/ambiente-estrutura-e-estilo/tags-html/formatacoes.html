<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatações</title>
</head>

<body>
    <h2>Formatações</h2>
    <hr>
    <p><strong>Esse é um texto em negrito</strong> utilizando uma tag semântica e recomendada para estes casos</p>
    <p><em>Esse é um texto com ênfase (itálico),</em> usando uma tag semântica</p>
    <!-- forma de colocar o número "acima", representando assim um número ao quadrado, ou ao cubo, utilizamos a tag sup para isso -->
    <p>Minha casa tem 80m<sup>2</sup></p>
    <!-- do mesmo jeito que acima, esse faz o inverso e coloca o caracter dentro da tag sub mais abaixo, assim como vemso em livros químicos, de ciências, algum caracter de uma formula específica -->
    <p>a composição química da água é H<sub>2</sub>O</p>
    <!-- hr == horizontal row, coloca uma linha preta na horizontal do nosso sistema, criando uma divisória útil para nós -->
</body>

</html>
