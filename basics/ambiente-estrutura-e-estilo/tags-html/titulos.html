<!DOCTYPE html>
<html lang="pt=br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Títulos</title>
</head>

<body>
    <!-- diferente do restante das páginas, comentei este h2 que descreve o conteúdo desta página, pois, como aprendemos, visando a semântica, boas práticas do código e etc, é ideal, se for para ter um título PRINCIPAL na página, que seja o H1, não o H2, e aqui, o h2 estaria desempenhando este papel e logo abaixo teriamos um exemplo usando h1, o que, vai contra os conceitos abordados anteriormente, por isso, para manter a hierarquia e as boas práticas, manterei apenas um H1 -->
    <!-- <h2>Títulos</h2> -->
    <!-- titulos, onde o h == heading, eles vão de 1 a 6 (h1 até h6), quanto maior for o número, menos importante ele será para a web, logo, o h6 é o menos importante e a web dará muito menos destaque para a informação contida nele -->
    <!-- por padrão, tomar cuidado ao definir o h1 de uma página, ele é o mais importante dela e por boas práticas também, cada página tem apenas 1 h1 e caso seja necessário mais títulos, trabalhar com h2 para frente -->
    <h1>Título Nível 1</h1>
    <h2>Título Nível 2</h2>
    <h3>Título Nível 3</h3>
    <h4>Título Nível 4</h4>
    <h5>Título Nível 5</h5>
    <h6>Título Nível 6</h6>
</body>

</html>
