<!DOCTYPE html>
<!-- tudo que for html ficará dentro dessa tag, ela indica para o navegador que estamos começando um arquivo html por aqui -->
<!-- atributo/propriedade lang diz qual é o idioma da página/site que estamos fazendo (pt-br e pt-BR possuem 0 diferença) -->
<html lang="pt-br">

<head>
    <!-- tag meta que se fecha sozinha, logo, não precisa de algo como: <meta></meta>, apenas: <meta > ela possui um atributo chamado charset que define qual o conjunto de caracteres que a nossa página irá utilizar na internet, como estamos no brasil e utilizamos caracteres daqui que podem não existir em outros países, como: ç,´....se não especificarmos um conjunto de caracteres que permita usarmos esses símbolos e letras, o site pode acabar quebrando ao usa-los -->
    <meta charset="UTF-8">
    <!-- outra tag meta que vai configurar quanto de espaço a página do nosso navegador vai utilizar, nomeamos essa tag meta de 'viewport' através do atributo 'name'-->
    <!-- o conteúdo da nossa meta tag nomeada de viewport é definido no atributo seguinte, chamado de content, onde passamos qual a largura que vamos usar (width=device-width, que diz para o navegador: vou usar toda a larguta dísponivel deste dispositivo, por isso: device-width, que traduzindo seria: largura do dispositivo) e a escala de zoom que vamos usar (initial-scale=1.0 estou dizendo que não vou fazer um zoom maior que o padrão utilizado por todos os outros sites e nem menor, utilizarei o padrão == 1.0)-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>

<body>

</body>

</html>
