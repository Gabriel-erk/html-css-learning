<!DOCTYPE html>
<html lang="pr-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragráfos</title>
</head>

<body>
    <h2>Parágrafos</h2>
    <hr>
    <!-- intepretado pela web como um texto comum, não é dada muita importância para ele (assim com um h6 por exemplo, quando comparado a importância que um h1 recebe, o h6/p tem importâncias consideravelmente menores), apenas conteúdo mesmo -->
    <!-- tag br faz uma quebra de linha entre o texto antes dele e o texto após (obs: não é uma forma profissional de quebrar linhas, o meio ideal é com o uso de css, utilizar o br é apenas uma grande gambiarra, por assim dizer) -->
    <p>Esse é um parágrafo de texto em <br> HTML</p>
</body>

</html>
