<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>

<body>
    <h2>Imagens</h2>
    <hr>
    <!-- img == image -->
    <!-- atributo src == source, que pergunta, de onde vem esta imagem? quando está na web, é chamado de caminho absoluto, já quando ela se encontra no nosso projeto, possui o nome de caminho relativo -->
    <!-- alt == alternative, texto alternativo para auxiliar pessoas com deficiência, que descreve melhor a sua imagem OU caso dê algum erro no carregamento da imagem, será mostrado o texto deste atributo alt E também auxilia os bots do google surante as varreduras deles pela web-->
    <!-- ao conseguir as imagens, colocar a de desktop aqui (maximo 1900 de largura) -->
    <img src="img/landscape-desktop.jpg" alt="Pôr do sol entre montanhas, com o céu em tons de laranja e roxo, refletindo na água de um lago em primeiro plano.">
    <!-- tablet aqui (maximo 720 de largura) -->
    <img src="img/landscape-tablet.jpg" alt="Pôr do sol entre montanhas, com o céu em tons de laranja e roxo, refletindo na água de um lago em primeiro plano.">
    <!-- celulares aqui (máximo 480 de largura) -->
    <img src="img/landscape-celular.jpg" alt="Pôr do sol entre montanhas, com o céu em tons de laranja e roxo, refletindo na água de um lago em primeiro plano.">
</body>

</html>
