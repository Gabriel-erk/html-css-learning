<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>

<body>
    <h2>Links</h2>
    <hr>
    <!-- link externo (que manda para forá do sistema) -->
    <!-- através do atributo target, faremos que quando o usuário clicar em algum link em nosso sistema, o link seja aberto em outra aba, pois, estatísticas comprovam que, ao usuário clicar em um link em nosso sistema e nossa página ser substituída pela do link, eles geralmente não voltam (por isso a melhor abordagem é fazer com que nosso site fique em aberto e o sistema do link seja exibido em outra guia) -->
    <!-- atributo rel == relationship (relação) que específica para o navegador e mecanismos de busca do google qual a RELAÇÃO deste nosso link (com a tag a) com o nosso sistema, aqui estamos dizendo com a palavra 'external' que ele é um link externo, isso não muda nada a respeito de funcionalidade e e visualmente, porém é melhor para mecanismos de busca, navegador...como citado acima -->
    <a href="http://www.alura.com.br" target="_blank" rel="external">Acesse o site da alura</a>

</body>

</html>
