<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tag link usada para 'linkar' recursos externos ao nosso produto (sistema) ou arquivos que tenho em alguma pasta a configuração do nosso site (por isso estamos chamando-a na tag head, já que o que esta tag link está trazendo é um recurso de configuração do nosso sistema (produto)), onde aqui estaremos trazendo o recurso/ferramente chamada favicon para nos permitir acessar sua biblioteca de icones para que consigamos usa-los em nosso produto (sistema) ao nosso bel-prazer  -->
     <!-- primeiro atributo (rel == relationship) diz: 'qual relação deste arquivo que você está trazendo? ou melhor que tipo de arquivo voce quer linkar nesta parte de configuração (tag head) do seu produto? ' -->
    <link rel="stylesheet" href="">
    <!-- nome do nosso sistema, ou seja, é o nome do nosso produto -->
    <title>Tecboard</title>
</head>
